name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag concourse-ssh-scp-resource:ci .

      - name: Check Python syntax
        run: docker run --rm --entrypoint python concourse-ssh-scp-resource:ci -m py_compile /opt/resource/check /opt/resource/in /opt/resource/out /opt/resource/shared.py

      - name: Run unit and resource tests
        run: docker run --rm --entrypoint python -e RESOURCE_DIR=/opt/resource -v "$PWD/tests:/tests:ro" concourse-ssh-scp-resource:ci -m unittest discover -s /tests -v

      - name: Check SSH and SCP tools
        run: docker run --rm --entrypoint sh concourse-ssh-scp-resource:ci -c 'command -v ssh && command -v scp'

      - name: Smoke test check resource
        run: docker run --rm --entrypoint /opt/resource/check concourse-ssh-scp-resource:ci

      - name: Smoke test in resource
        run: docker run --rm --entrypoint sh concourse-ssh-scp-resource:ci -c 'printf "%s" '\''{"source":{"user":"","host":"","private_key":""},"params":{}}'\'' | /opt/resource/in /tmp'

      - name: Smoke test out resource
        run: docker run --rm --entrypoint sh concourse-ssh-scp-resource:ci -c 'printf "%s" '\''{"source":{"user":"ci-user","host":"example.invalid","private_key":"test-key","known_hosts":"example.invalid ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"},"params":{}}'\'' | /opt/resource/out /tmp'

  publish-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tklein1801/concourse-ssh-scp-resource
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
